name: Bug or learner friction
description: Reproducible behavior, grading problem, or accessibility failure
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Do not include secrets, learner PII, or confidential test material. Use the private reporting guidance in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Learner impact and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, actual result, environment and version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and acceptance test
