name: Web app validation

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-app.yml"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-app:
    name: web-app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit dependency tree
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production build
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium for browser smoke tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: apps/web
        run: npm run test:e2e
