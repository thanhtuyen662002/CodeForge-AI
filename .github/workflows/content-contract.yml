name: Content graph contract
on:
  pull_request:
    paths:
      - 'packages/content-contract/**'
      - 'tests/content-contract/**'
      - '.github/workflows/content-contract.yml'
  push:
    branches: [main]
    paths:
      - 'packages/content-contract/**'
      - 'tests/content-contract/**'
      - '.github/workflows/content-contract.yml'
permissions:
  contents: read
concurrency:
  group: content-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Typecheck content contract
        run: npm exec --yes --ignore-scripts --package=typescript@6.0.3 -- tsc --noEmit -p packages/content-contract/tsconfig.json
      - name: Validate content graph contract
        run: node --experimental-strip-types --test tests/content-contract/*.test.mjs
