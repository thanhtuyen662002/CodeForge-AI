name: Planning integrity
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'codex/strategy-validation-*']
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/check-planning.mjs
      # The ruleset requires this job, not the separate path-filtered web-app
      # workflow. Keep app-bearing changes inside the required merge gate.
      - name: Detect web app and require pinned inputs
        id: web-app
        shell: bash
        run: |
          if [ -d apps/web ]; then
            test -f apps/web/package.json || { echo "apps/web/package.json is required when apps/web exists" >&2; exit 1; }
            test -f apps/web/package-lock.json || { echo "apps/web/package-lock.json is required when apps/web exists" >&2; exit 1; }
            test -f apps/web/.nvmrc || { echo "apps/web/.nvmrc is required when apps/web exists" >&2; exit 1; }
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pinned web Node and npm cache
        if: steps.web-app.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned web dependencies
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci
      - name: Audit web dependencies
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Lint web app
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck web app
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npm run typecheck
      - name: Build web app
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium for web smoke tests
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run web Playwright tests
        if: steps.web-app.outputs.present == 'true'
        working-directory: apps/web
        run: npm run test:e2e
      - name: Check committed diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_REF" ]; then
              echo "Missing pull request base ref; refusing to skip diff validation." >&2
              exit 1
            fi
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            CURRENT_BASE_REF="refs/remotes/origin/${BASE_REF}"
            if ! git merge-base --is-ancestor "$CURRENT_BASE_REF" HEAD; then
              echo "Pull-request merge context is stale relative to the current base; refusing to pass merge-gate." >&2
              exit 1
            fi
            git diff --check "${CURRENT_BASE_REF}...HEAD"
          elif [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            git diff --check "$MERGE_GROUP_BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
