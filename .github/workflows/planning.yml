name: Planning integrity
on:
  pull_request:
  push:
    branches: [main, 'codex/strategy-validation-*', 'codex/system-blueprint-*']
  merge_group:
permissions:
  contents: read
concurrency:
  group: planning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/check-planning.mjs
      - run: node scripts/check-locales.mjs
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run prototype browser and keyboard smoke
        run: node scripts/check-prototype-browser.cjs
      - name: Check committed diff whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            git diff --check "$MERGE_GROUP_BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi
